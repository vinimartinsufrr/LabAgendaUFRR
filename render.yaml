# Blueprint do Render para publicar a API (https://render.com/docs/blueprint-spec)
# As variáveis marcadas com "sync: false" são preenchidas no painel do Render.
services:
  - type: web
    name: labagenda-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_URL
        sync: false
